name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  workflow_call:

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'kbudde' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Lint (mise run lint)
        run: mise run lint

      - name: Format check (mise run fmt-check)
        run: mise run fmt-check

# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload

args:
  version:
    default: "2.0.24"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENCODE_VERSION  
provides: ["opencode@${{ kit.args.version }}"]

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
#          - api.anthropic.com
          - opencode.ai
          - models.dev
          - registry.npmjs.org
#          - pypi.org
#          - files.pythonhosted.org
  - type: com.docker.sandbox/credential@1
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: OPENCODE_API_KEY
        proxyManaged: true
        inject:
          - domain: opencode.ai
            header: x-api-key
            format: "%s"
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      content: |
        OpenCode runs as the agent user inside a sandbox. Python, uv, npm and jq are available.
        Use the project's environment and dependency configuration.
        The sandbox is filtering network access. Do not try to workaround the restriction. If the access fails, ask the user to add the domain to the network policy.

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -e
            opencode mcp add mcpgw --url $MCP_GATEWAY_URL --header "Authorization=Bearer proxy-managed" --global
            f="$(opencode debug config| jq -r '.[]|select(.type=="directory").path')/limit-providers.json"
            echo '{"enabled_providers": ["opencode-go"]}' > "$f"
          env: [MCP_GATEWAY_URL]
          user: agent
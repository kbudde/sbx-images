# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: Skills for opencode
description: Collection of skills and agents for opencode.

# provides:
#   - "factory@0.1.0"

capabilities:
  #   - type: com.docker.sandbox/agent-skills@1
  #     config:
  #       path: /home/agent/.agents/skills
  #       mode: readonly

  # - type: com.docker.sandbox/agent-context@1
  #   config:
  #     contentFile: ./context.md

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command:
            - sh
            - -c
            - |
              echo "Syncing factory agents and templates into the OpenCode config"
              mkdir -p /home/agent/.config/opencode
              cp -r /import/skills/* /home/agent/.config/opencode/
          description: Sync settings into the OpenCode config
          user: "1000"

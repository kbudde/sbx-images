# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: AI tools mixin

args:
  serena_version:
    default: "1.7.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: SERENA_VERSION

provides:
  - "serena@${{ kit.args.serena_version }}"
  - "archify@0.0.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - pypi.org
          - files.pythonhosted.org
          - registry.npmjs.org
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./context.md

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: opencode mcp add serena -- serena start-mcp-server --project-from-cwd --context agent
          user: "1000"
# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Go toolchain mixin

args:
  version:
    default: "1.27.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: GO_VERSION

provides: ["go@${{ kit.args.version }}"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - proxy.golang.org

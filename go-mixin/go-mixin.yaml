# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: Go toolchain mixin

args:
  version:
    default: "1.27.4"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: GO_VERSION

provides: ["go@${{ kit.args.version }}"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - proxy.golang.org
